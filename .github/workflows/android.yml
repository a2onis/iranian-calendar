name: ساخت APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ساخت و آزمون
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: دریافت کد
        uses: actions/checkout@v5

      - name: نصب JDK ۱۷
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ساخت و آزمون
        run: |
          set -o pipefail
          {
            gradle :app:assembleDebug --no-daemon --stacktrace
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          } 2>&1 | tee build-log.txt

      - name: بارگذاری گزارش ساخت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: بارگذاری گزارش آزمون
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: گزارش-آزمون
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: نام‌گذاری APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/gahshomar-parsi.apk"

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: gahshomar-parsi-apk
          path: dist/gahshomar-parsi.apk
          if-no-files-found: error

      - name: پیوست به انتشار برای برچسب‌ها
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gahshomar-parsi.apk
