name: ساخت APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ساخت و آزمون
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: دریافت کد
        uses: actions/checkout@v5

      - name: نصب JDK ۱۷
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ساخت و آزمون
        run: |
          set -o pipefail
          {
            gradle :app:assembleDebug --no-daemon --stacktrace
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          } 2>&1 | tee build-log.txt

      - name: بارگذاری گزارش ساخت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: بارگذاری گزارش آزمون
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: گزارش-آزمون
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: گزارش خطاها در گفت‌وگوی Pull Request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### نتیجهٔ ساخت: ناموفق"
            echo '```'
            grep -E "^e: |^w: .*(error|unresolved)|error:|Unresolved reference|FAILURE|Execution failed|Caused by" build-log.txt | head -60
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: نام‌گذاری APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/gahshomar-parsi.apk"

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: gahshomar-parsi-apk
          path: dist/gahshomar-parsi.apk
          if-no-files-found: error

      - name: انتشار برای برچسب‌ها
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: گاه‌شمار پارسی ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/gahshomar-parsi.apk
          body: |
            **گاه‌شمار پارسی** — تقویم خورشیدی ایران، مناسبت‌های کهن، آیین‌های زرتشتی و فرهنگ ایران.

            فایل پیوستِ این انتشار، نسخهٔ نصب‌شدنی اندروید است:

            * `gahshomar-parsi.apk` — APK اشکال‌زدایی (debug-signed)، اندروید ۷ (API 24) و بالاتر
            * برای نصب: فایل را روی گوشی بارگیری کنید و «نصب از منابع نامشخص» را برای مرورگر یا مدیر فایل روشن کنید
            * برنامه هیچ مجوز اینترنتی ندارد و کاملاً آفلاین کار می‌کند

            ### چه چیزی در برنامه هست
            * تقویم خورشیدی با محاسبهٔ نجومی رسمی ایران (اعتدال بهاری به وقت تهران)
            * نمای ماه، نمای سال، نوار هفته و روزنگار کامل هر روز
            * گاه‌شماری میلادی، هجری قمری، اوستایی و نماد چرخهٔ چینی
            * ۴۹ مناسبت ایرانی، زرتشتی و ادبی با جست‌وجو و دسته‌بندی
            * ۵۶ نوشتار در پنج دسته: نوروز و آیین‌ها، دین زرتشتی، ایران باستان، فرهنگ و هنر، گاه‌شماری
            * خط زمان ۲۹ رویدادی ایران باستان و ۲۴ سخن روز
            * تبدیل تاریخ، یادداشت روزانه، نشان‌کردن مناسبت‌ها و یادآور روزانه
            * پوستهٔ روشن و تیره با نقش‌مایه‌های ایرانی؛ تمام‌فارسی و بدون اینترنت
